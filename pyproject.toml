[project]
name = "agdapm"
version = "0.0.1"
authors = [
  { name="Demetrius", email="illegalbassmedicine@proton.me" },
]
description = "A small package manager for Agda"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3"
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.scripts]
agdapm = "agdapm.cli:main"


[project.urls]
Homepage = "https://github.com/cwkiz/agdapm"
Repository = "https://github.com/cwkiz/agdapm.git"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"